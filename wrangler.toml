# Cloudflare deploy settings for Betty's Kie.ai connector.
# Lives at the repo root so Cloudflare finds it without a Root directory setting.
name = "bettys-soul-system"
main = "kie-connector/src/index.js"
compatibility_date = "2025-06-01"

# Secrets (set in the Cloudflare dashboard, never in this file):
#   KIE_API_KEY          your Kie.ai API key
#   CONNECTOR_PASSWORD   a long made-up password that goes in the connector link
